name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor to Native Android
        run: npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Active Java Version
        run: java -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Temporary Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        id: build_apk
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Generated APK
        id: verify_apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: Expected APK not found or empty at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          TITLE="Android Debug APK #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=${TITLE}" >> "$GITHUB_ENV"
          gh release create "${TAG}" \
            "android/app/build/outputs/apk/debug/app-debug.apk#app-debug.apk" \
            --target "${GITHUB_SHA}" \
            --title "${TITLE}" \
            --notes "Automated debug APK build #${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT}) for ${GITHUB_SHA}." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          APK_BUILD_OUTCOME: ${{ steps.verify_apk.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          APK_FILENAME="app-debug.apk"
          DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${APK_FILENAME}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_PAGE_URL=$(gh release view "${RELEASE_TAG}" --json url -q .url)
            gh release view "${RELEASE_TAG}"

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_PAGE_URL}"
            echo "APK Filename: ${APK_FILENAME}"
            echo "Direct APK URL: ${DIRECT_APK_URL}"
            echo "Backup Actions Artifact: app-debug-apk"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_APK_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_PAGE_URL}"
              echo "- **APK Filename:** \`${APK_FILENAME}\`"
              echo "- **Backup:** Actions artifact \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed."
            if [ "$APK_BUILD_OUTCOME" = "success" ]; then
              echo "APK build succeeded: android/app/build/outputs/apk/debug/app-debug.apk"
            else
              echo "APK build did not complete successfully."
            fi
            if [ "$ARTIFACT_OUTCOME" = "success" ]; then
              echo "Actions artifact 'app-debug-apk' remains available."
            fi

            {
              echo "## Release Publishing Warning"
              echo ""
              echo "GitHub Release publishing failed; the latest direct-download link was **not** updated with this build."
              if [ "$APK_BUILD_OUTCOME" = "success" ]; then
                echo "- APK build succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)."
              fi
              if [ "$ARTIFACT_OUTCOME" = "success" ]; then
                echo "- Actions artifact \`app-debug-apk\` remains available."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
